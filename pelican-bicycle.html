<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鹈鹕踩单车 🚴‍♂️</title>
  <style>
    :root {
      --surface-0: #05070C;
      --surface-1: #0A0D12;
      --accent: #38BDF8;
      --pelican: #F8E8D8;
      --beak: #E9A568;
      --bike: #3B6DFF;
      --wheel: #1E2636;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, var(--surface-0) 0%, var(--surface-1) 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .scene {
      width: 100%;
      max-width: 800px;
      height: 500px;
      position: relative;
      overflow: hidden;
    }

    svg {
      width: 100%;
      height: 100%;
    }

    .ground {
      position: absolute;
      bottom: 0;
      width: 200%;
      height: 3px;
      background: repeating-linear-gradient(
        90deg,
        var(--accent) 0px,
        var(--accent) 20px,
        transparent 20px,
        transparent 40px
      );
      animation: moveGround 2s linear infinite;
    }

    @keyframes moveGround {
      from { transform: translateX(0); }
      to { transform: translateX(-40px); }
    }

    .cloud {
      position: absolute;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 100px;
      animation: moveCloud linear infinite;
    }

    .cloud1 { width: 100px; height: 40px; top: 50px; left: 10%; animation-duration: 20s; }
    .cloud2 { width: 80px; height: 35px; top: 100px; left: 60%; animation-duration: 25s; }
    .cloud3 { width: 120px; height: 45px; top: 80px; left: 80%; animation-duration: 30s; }

    @keyframes moveCloud {
      from { transform: translateX(0); }
      to { transform: translateX(-100vw); }
    }

    h1 {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      color: var(--accent);
      text-shadow: 0 2px 10px rgba(56, 189, 248, 0.3);
      letter-spacing: -0.02em;
    }

    /* SVG Animations */
    .pedal-group {
      transform-origin: 400px 310px;
      animation: rotatePedal 1s linear infinite;
    }

    @keyframes rotatePedal {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .wheel {
      transform-origin: center;
      animation: rotateWheel 1s linear infinite;
    }

    .front-wheel { transform-origin: 520px 340px; }
    .back-wheel { transform-origin: 350px 340px; }

    @keyframes rotateWheel {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .pelican-body {
      animation: bobBody 0.5s ease-in-out infinite alternate;
    }

    @keyframes bobBody {
      from { transform: translateY(0px); }
      to { transform: translateY(-3px); }
    }

    .wing {
      transform-origin: 380px 250px;
      animation: flapWing 0.3s ease-in-out infinite alternate;
    }

    @keyframes flapWing {
      from { transform: rotate(-5deg); }
      to { transform: rotate(15deg); }
    }

    .leg-left {
      transform-origin: 390px 285px;
      animation: pedalLeft 1s ease-in-out infinite;
    }

    .leg-right {
      transform-origin: 410px 285px;
      animation: pedalRight 1s ease-in-out infinite;
    }

    @keyframes pedalLeft {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(25deg); }
    }

    @keyframes pedalRight {
      0%, 100% { transform: rotate(25deg); }
      50% { transform: rotate(0deg); }
    }
  </style>
</head>
<body>
  <h1>🚴‍♂️ 鹈鹕踩单车</h1>
  
  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>
  <div class="cloud cloud3"></div>

  <div class="scene">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
      <!-- Bicycle Frame -->
      <g class="bicycle">
        <!-- Back Wheel -->
        <g class="wheel back-wheel">
          <circle cx="350" cy="340" r="45" fill="var(--wheel)" stroke="var(--bike)" stroke-width="8"/>
          <line x1="350" y1="295" x2="350" y2="385" stroke="var(--accent)" stroke-width="2"/>
          <line x1="305" y1="340" x2="395" y2="340" stroke="var(--accent)" stroke-width="2"/>
          <line x1="318" y1="308" x2="382" y2="372" stroke="var(--accent)" stroke-width="2"/>
          <line x1="382" y1="308" x2="318" y2="372" stroke="var(--accent)" stroke-width="2"/>
        </g>

        <!-- Front Wheel -->
        <g class="wheel front-wheel">
          <circle cx="520" cy="340" r="45" fill="var(--wheel)" stroke="var(--bike)" stroke-width="8"/>
          <line x1="520" y1="295" x2="520" y2="385" stroke="var(--accent)" stroke-width="2"/>
          <line x1="475" y1="340" x2="565" y2="340" stroke="var(--accent)" stroke-width="2"/>
          <line x1="488" y1="308" x2="552" y2="372" stroke="var(--accent)" stroke-width="2"/>
          <line x1="552" y1="308" x2="488" y2="372" stroke="var(--accent)" stroke-width="2"/>
        </g>

        <!-- Frame -->
        <line x1="350" y1="340" x2="400" y2="290" stroke="var(--bike)" stroke-width="6" stroke-linecap="round"/>
        <line x1="400" y1="290" x2="450" y2="310" stroke="var(--bike)" stroke-width="6" stroke-linecap="round"/>
        <line x1="350" y1="340" x2="400" y2="310" stroke="var(--bike)" stroke-width="6" stroke-linecap="round"/>
        <line x1="400" y1="310" x2="450" y2="310" stroke="var(--bike)" stroke-width="6" stroke-linecap="round"/>
        <line x1="450" y1="310" x2="520" y2="340" stroke="var(--bike)" stroke-width="6" stroke-linecap="round"/>
        <line x1="450" y1="310" x2="470" y2="260" stroke="var(--bike)" stroke-width="6" stroke-linecap="round"/>
        <line x1="470" y1="260" x2="520" y2="270" stroke="var(--bike)" stroke-width="6" stroke-linecap="round"/>
        <line x1="520" y1="270" x2="520" y2="340" stroke="var(--bike)" stroke-width="6" stroke-linecap="round"/>
        
        <!-- Handlebar -->
        <line x1="520" y1="270" x2="530" y2="250" stroke="var(--bike)" stroke-width="5" stroke-linecap="round"/>
        <line x1="520" y1="250" x2="540" y2="250" stroke="var(--bike)" stroke-width="5" stroke-linecap="round"/>

        <!-- Seat -->
        <ellipse cx="400" cy="285" rx="25" ry="8" fill="var(--bike)"/>
        <line x1="400" y1="290" x2="400" y2="310" stroke="var(--bike)" stroke-width="4"/>

        <!-- Pedal System -->
        <g class="pedal-group">
          <circle cx="400" cy="310" r="8" fill="var(--wheel)"/>
          <line x1="400" y1="310" x2="385" y2="330" stroke="var(--bike)" stroke-width="4" stroke-linecap="round"/>
          <rect x="380" y="328" width="10" height="6" fill="var(--beak)" rx="2"/>
          <line x1="400" y1="310" x2="415" y2="290" stroke="var(--bike)" stroke-width="4" stroke-linecap="round"/>
          <rect x="410" y="288" width="10" height="6" fill="var(--beak)" rx="2"/>
        </g>
      </g>

      <!-- Pelican -->
      <g class="pelican-body">
        <!-- Body -->
        <ellipse cx="400" cy="260" rx="55" ry="65" fill="var(--pelican)" stroke="#D0C0B0" stroke-width="2"/>
        
        <!-- Wing -->
        <g class="wing">
          <ellipse cx="360" cy="250" rx="40" ry="25" fill="#E8D8C8" stroke="#D0C0B0" stroke-width="2"/>
          <path d="M 330 250 Q 320 245, 315 255 Q 320 260, 330 258" fill="#D0C0B0"/>
          <path d="M 330 255 Q 320 250, 315 260 Q 320 265, 330 263" fill="#D0C0B0"/>
        </g>

        <!-- Neck -->
        <path d="M 420 230 Q 440 200, 450 180" stroke="var(--pelican)" stroke-width="18" fill="none" stroke-linecap="round"/>
        
        <!-- Head -->
        <circle cx="455" cy="170" r="22" fill="var(--pelican)" stroke="#D0C0B0" stroke-width="2"/>
        
        <!-- Eye -->
        <circle cx="460" cy="165" r="4" fill="#0A0D12"/>
        <circle cx="462" cy="163" r="1.5" fill="white"/>

        <!-- Beak Upper -->
        <path d="M 470 175 Q 510 172, 520 175 Q 510 178, 470 180 Z" fill="var(--beak)" stroke="#D4955C" stroke-width="1.5"/>
        
        <!-- Beak Lower with Pouch -->
        <path d="M 470 180 Q 500 185, 520 180 Q 515 200, 490 205 Q 465 200, 470 180 Z" 
              fill="#F5C896" stroke="#D4955C" stroke-width="1.5"/>

        <!-- Legs -->
        <g class="leg-left">
          <line x1="390" y1="310" x2="385" y2="330" stroke="#D4955C" stroke-width="5" stroke-linecap="round"/>
        </g>
        <g class="leg-right">
          <line x1="410" y1="310" x2="415" y2="290" stroke="#D4955C" stroke-width="5" stroke-linecap="round"/>
        </g>

        <!-- Tail -->
        <path d="M 350 280 Q 330 290, 330 300 Q 335 295, 345 285 Z" fill="#D0C0B0"/>
      </g>
    </svg>
  </div>

  <div class="ground"></div>
</body>
</html>
